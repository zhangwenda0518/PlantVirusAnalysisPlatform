<!DOCTYPE html>
<html lang="{{ 'en' if lang == 'en' else 'zh-CN' }}">
<head>
<meta charset="utf-8">
<title>{{ 'Sample creation / batch import - Plant Virus Analysis Platform' if lang == 'en' else '样品创建 / 批量导入 - 植物病毒分析平台' }}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="vp-lang" content="{{ lang }}">
<script>try{if(localStorage.getItem("vp_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
{% include "_nav.html" %}

<div class="page">
  <div class="tools-layout group-layout">
    {% include "_group_nav.html" %}
    <main class="group-main">
  <div class="layout">
    <div class="col">
      <div class="card" data-guide="Samples"">
        <h1 data-i18n="sc.title">🧾 样品创建 / 批量导入</h1>
        <p class="hint" data-i18n="sc.intro">独立模块：登记样品（单个或从文件夹批量扫描），不启动分析。
        创建后可在本页表格中查看、改名、删除；分析请到顶部各功能模块选样品运行
        （全流程「自动化分析流程」页已于 2026-10 归档，不适合本地电脑运行）。</p>

        {% include "_samples_new.html" %}
      </div>

      <div class="card">
        <h2><span data-i18n="sc.samplesHeading">样品（</span><span id="scCount">0</span>）</h2>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <select id="projFilter" onchange="gxProjChanged(this)"
                  style="flex:1;font-size:12px"></select>
        </div>
        <div id="scErr" class="err"></div>
        <div id="scSamples"><p class="hint" data-i18n="c.loading">加载中…</p></div>
      </div>
    </div>
  </div>
    </main>
  </div>
</div>

<!-- 文件/目录选择对话框 -->
{% include "_browse_dlg.html" %}

<script src="/static/i18n.js?v={{ asset_v }}"></script>
<script src="/static/app.js?v={{ asset_v }}"></script>
<script src="/static/app-samples.js?v={{ asset_v }}"></script>
  <script src="/static/app-compare.js?v={{ asset_v }}"></script>
  <script src="/static/app-runhistory.js?v={{ asset_v }}"></script>
  <script src="/static/app-jobs.js?v={{ asset_v }}"></script>
  <script src="/static/app-browse.js?v={{ asset_v }}"></script>
  <script src="/static/app-batch.js?v={{ asset_v }}"></script>
  <script src="/static/app-storage.js?v={{ asset_v }}"></script>
<script src="/static/examples.js?v={{ asset_v }}"></script>
<script>
/* $ / esc / browse / toast / startPolling 均来自 app.js */

async function scDelete(name) {
  if (!confirm(t('sc.delConfirm','删除样品 {name}？（results/ 下该样品目录将移除）').replace('{name}', name))) return;
  try {
    const r = await fetch(`/api/samples/${encodeURIComponent(name)}/delete`,
                          { method: 'POST' });
    if (!r.ok) { alert((await r.json()).error || t('sc.delFail','删除失败')); return; }
    scLoadSamples();
  } catch (e) { alert(t('sc.connFail','无法连接平台服务: ') + e); }
}

/* ---- 样品表格 + 行内改名（改的是 results/ 下的真实目录名，产物随目录保留） ---- */
let RENAME_EDIT = null;   // 处于编辑态的样品名（一次只允许一行）
let RENAME_ERR = '';

function scRenameStart(name) {
  RENAME_EDIT = name;
  scLoadSamples();
  setTimeout(() => { const i = $('rnInput'); if (i) { i.focus(); i.select(); } }, 60);
}

function scRenameCancel() {
  RENAME_EDIT = null;
  scLoadSamples();
}

async function scRenameSave(oldName) {
  const inp = $('rnInput');
  const nn = (inp?.value || '').trim();
  if (!nn || nn === oldName) { scRenameCancel(); return; }
  try {
    const r = await fetch(`/api/samples/${encodeURIComponent(oldName)}/rename`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ new_name: nn })});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      RENAME_ERR = d.error || t('sc.renameFail', '改名失败');
      scLoadSamples();
      return;
    }
    RENAME_EDIT = null;
    RENAME_ERR = d.note || '';
    toast(t('sc.renameTitle', '样品改名'),
          `✔ ${oldName} → ${d.sample}`, { ttl: 4000 });
    scLoadSamples();
  } catch (e) {
    RENAME_ERR = t('sc.connFail', '无法连接平台服务: ') + e;
    scLoadSamples();
  }
}

async function scLoadSamples() {
  const box = $('scSamples');
  const errBox = $('scErr');
  if (errBox) errBox.textContent = RENAME_ERR || '';
  try {
    const list = await (await fetch('/api/samples')).json();
    $('scCount').textContent = list.length;
    if (!list.length) {
      box.innerHTML = '<p class="hint">' + t('c.noSample','暂无样品，先在左侧创建') + '</p>';
      return;
    }
    const sel = $('projFilter');
    const projs = [...new Set(list.map(s => s.project).filter(Boolean))];
    // 全局项目 = 默认筛选条件（gx 系列来自 app.js；本页手动选过则尊重本页）
    const cur = gxSyncProjSelect(sel, projs);
    const shown = cur ? list.filter(s => s.project === cur) : list;
    if (!shown.length) {
      box.innerHTML = '<p class="hint">' + t('c.noSampleProj','该项目下暂无样品') + '</p>';
      return;
    }
    const cut = (p, n) => {
      const b = String(p || '').split(/[\\/]/).pop();
      return b.length > n ? b.slice(0, n - 1) + '…' : b;
    };
    const rows = shown.map(s => {
      const editing = RENAME_EDIT === s.name;
      // 样品名可能含引号等字符：一律 data-* + dataset 传参（防内联注入）
      const nameCell = editing
        ? `<input id="rnInput" data-old="${esc(s.name)}" value="${esc(s.name)}"
             style="width:100%;min-width:120px;font-size:12px"
             onkeydown="if(event.key==='Enter')scRenameSave(this.dataset.old);else if(event.key==='Escape')scRenameCancel()">`
        : `<b class="mono" style="font-size:12px" title="${esc(s.name)}">${esc(s.name)}</b>`;
      const ops = editing
        ? `<button class="btn small primary" title="保存新名字" data-old="${esc(s.name)}" onclick="scRenameSave(this.dataset.old)">✔</button>
           <button class="btn small" title="取消" onclick="scRenameCancel()">✖</button>`
        : `<button class="btn small" title="改名（分析产物随目录一起保留）" data-sample="${esc(s.name)}" onclick="scRenameStart(this.dataset.sample)">✏️</button>
           <button class="btn small danger" title="删除样品及其全部文件" data-sample="${esc(s.name)}" onclick="scDelete(this.dataset.sample)">🗑</button>`;
      return `<tr>
        <td style="white-space:nowrap;max-width:180px">${nameCell}</td>
        <td style="text-align:center">${s.r2 ? 'PE' : 'SE'}</td>
        <td class="mono" title="${esc(s.r1)}" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cut(s.r1, 20) || '—'}</td>
        <td class="mono" title="${esc(s.r2)}" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cut(s.r2, 20) || '—'}</td>
        <td style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.project || '') || '<span class=hint>—</span>'}</td>
        <td style="text-align:center">${s.done}/${s.total}</td>
        <td style="white-space:nowrap">${ops}
          <a class="btn small" href="/pipeline" title="去运行分析">▶</a></td>
      </tr>`;
    }).join('');
    box.innerHTML =
      '<div class="scroll-md"><table style="width:100%;border-collapse:collapse;font-size:12px">' +
      '<tr><th style="text-align:left">' + t('sc.colName', '样品名') + '</th>' +
      '<th style="text-align:left">' + t('sc.colType', '类型') + '</th>' +
      '<th style="text-align:left">R1</th><th style="text-align:left">R2</th>' +
      '<th style="text-align:left">' + t('sc.colProject', '项目') + '</th>' +
      '<th style="text-align:left">' + t('sc.progress', '进度') + '</th>' +
      '<th style="text-align:left">' + t('sc.colOps', '操作') + '</th></tr>' +
      rows + '</table></div>';
  } catch (e) { box.innerHTML = '<p class="hint">' + t('sc.loadFail','加载失败') + '</p>'; }
}

scLoadSamples();
startPolling();
loadQueue();
setInterval(scLoadSamples, 30000);

// 下载页「🧾 样品」发送过来的文件预填（样品名留空，由用户填写或创建时按 R1 自动命名）
(function () {
  const pf = takePrefill('samples');
  if (!pf) return;
  $('r1').value = pf.r1 || '';
  $('r2').value = pf.r2 || '';
  toast(t('hr.prefill','已带入下载文件'), (pf.r1 || '') + (pf.r2 ? ' + ' + pf.r2 : ''), { ttl: 5000 });
})();
</script>
</body>
</html>
