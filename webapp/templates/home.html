<!DOCTYPE html>
<html lang="{{ 'en' if lang == 'en' else 'zh-CN' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="vp-lang" content="{{ lang }}">
<title>{{ 'Plant Virus Analysis Platform' if lang == 'en' else '植物病毒分析平台' }}</title>
<script>try{if(localStorage.getItem("vp_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
{% include "_nav.html" %}

<div class="page">
  <!-- 2026-10-30 用户定案：封面（平台名 + 定位语）删除；环境状态条搬进顶栏
       （_nav.html），模块/工具/数据库/磁盘一览与「环境自检」入口随顶栏常驻。
       总览页从此只有 AI 工作台 + 最近样品。 -->

  <!-- 运行中任务：只在真的有任务时出现（无任务整块 hidden，不占位）。
       数据来自全局任务轮询（app.js navTasksBadgeLoop），不额外发请求。 -->
  <div id="runSec" hidden>
    <h2 class="sec sec-split">🔴 <span data-i18n="hm.runSection">运行中任务</span>
      <i class="sec-fill"></i>
      <a class="sec-more" href="/tasks" data-i18n="hm.secAll">全部 ›</a></h2>
    <div id="runList" class="run-list"></div>
  </div>

  <!-- AI 分析台（2026-10-29 用户要求）：紧跟封面（数据库模块已在封面内）。
       一句话就能触发真实动作（建样品 / 组装 / 建宿主基因组库 / 多步计划），
       执行单仍需批准。实现上不复制聊天引擎：_nav.html 注入的 #aiDock 在
       总览被移进这里改成流式布局，其它页面仍是右下角浮坞。
       样品创建只在封面保留入口（点按钮去 /samples），总览不再内嵌表单。 -->
  <section class="card ai-console" id="aiConsole">
    <p class="hint ai-console-hint" data-i18n="hm.aiConsoleHint">直接说你要做什么：建样品、跑组装、构建宿主基因组库，或一次排好多步。</p>
    <div class="ai-console-grid">
      <div id="aiConsoleHost" class="ai-console-host"></div>
      <!-- 工作区文件（2026-10-30）：只读浏览 + 预览；想让 AI 用某个文件，
           点输入框的「＋」附加，而不是在这里点。 -->
      <aside class="ai-files" id="aiFiles">
        <div class="ai-files-head">
          <b data-i18n="ai.files.title">工作区文件</b>
          <select id="aiFilesRoot" class="ai-files-root" title="切换目录"></select>
        </div>
        <div class="ai-files-bar">
          <input id="aiFilesFilter" type="text" placeholder="筛选文件…"
                 data-i18n-ph="ai.files.filter">
          <button type="button" id="aiFilesUp" class="ai-files-up" title="上一级">⬆</button>
        </div>
        <div class="ai-files-path" id="aiFilesPath"></div>
        <div class="ai-files-list" id="aiFilesList"></div>
      </aside>
    </div>
  </section>

  <!-- 文件预览（点右侧列表里的文件打开；同源只读 /api/fs/read|raw） -->
  <div id="fsPreview" class="fs-preview" hidden>
    <div class="fs-preview-box">
      <div class="fs-preview-head">
        <b id="fsPreviewName"></b>
        <span id="fsPreviewMeta" class="hint"></span>
        <button type="button" onclick="VPFiles.close()" aria-label="关闭">✕</button>
      </div>
      <div class="fs-preview-body" id="fsPreviewBody"></div>
    </div>
  </div>

  <!-- 常用工具 -->
  <div id="favSection" style="display:none">
    <h2 class="sec">⭐ <span data-i18n="fav.strip">常用工具</span></h2>
    <div id="favStrip" class="fav-strip"></div>
  </div>

  <!-- 最近样品 -->
  <h2 class="sec sec-split">🧪 <span data-i18n="hm.recentSection">最近样品</span>
    <i class="sec-fill"></i>
    <span class="sec-stat" id="sampleStat"></span>
    <a class="sec-more" href="/samples" data-i18n="hm.manageSamples">管理样品 ›</a></h2>
  <div id="homeSamples" class="module-grid"><p class="hint" data-i18n="c.loading">加载中…</p></div>
</div>

<!-- AI 助手对话坞已全局化：随 _nav.html 注入每个页面（2026-10-02），
     本页不再单独携带。事件流/快捷指令/闸门确认在任何页面都可用。 -->

<!-- 文件/目录选择对话框：AI 分析台的「＋」附加文件需要它（共享片段） -->
{% include "_browse_dlg.html" %}

<script src="/static/i18n.js?v={{ asset_v }}"></script>
<script src="/static/app.js?v={{ asset_v }}"></script>
  <script src="/static/app-compare.js?v={{ asset_v }}"></script>
  <script src="/static/app-runhistory.js?v={{ asset_v }}"></script>
  <script src="/static/app-jobs.js?v={{ asset_v }}"></script>
  <script src="/static/app-browse.js?v={{ asset_v }}"></script>
  <script src="/static/app-ai-files.js?v={{ asset_v }}"></script>
  <script src="/static/app-batch.js?v={{ asset_v }}"></script>
  <script src="/static/app-storage.js?v={{ asset_v }}"></script>
<script src="/static/examples.js?v={{ asset_v }}"></script>
<script>
/* 环境状态条（2026-11-03 迁出）：渲染归 app.js 的 envStrip 控制器统一负责
   （本页 = 全局口径，其它页 = 本模块口径，数据同出 /api/env_status）。
   样品创建 / 批量导入只在封面保留入口（2026-10-29 用户定案：内嵌面板
   太占地方）。按钮就是普通链接 → /samples，本页不再绑定任何展开逻辑。 */

/* AI 分析台：把全站对话坞搬进总览卡片（2026-10-29）。
   坞的 DOM/事件流/流式渲染全部复用，只是位置从 fixed 变成文档流；
   离开总览后自然恢复成右下角浮坞。 */
(function () {
  var host = document.getElementById('aiConsoleHost');
  var dock = document.getElementById('aiDock');
  if (!host || !dock) return;
  host.appendChild(dock);
  dock.classList.add('ai-inline');
  dock.hidden = false;
  /* 2026-11-02：悬浮球改成独立「问答平台」后，它的显隐归 app-qa.js 管，
     本页不再藏它 —— 总览页本来也能问「这平台怎么用」。
     工作台在总览页就在页面里（上面搬进卡片了），所以顶栏那颗 🧠 按钮
     在这儿是多余的，藏掉，避免同一屏两个工作台入口。 */
  var wbBtn = document.getElementById('aiDockBtn');
  if (wbBtn) wbBtn.hidden = true;
  if (window.AI) {
    AI.open = true;
    if (AI.clearUnread) AI.clearUnread();
    if (AI.ensureCtx) AI.ensureCtx();
  }
})();
</script>
</body>
</html>
