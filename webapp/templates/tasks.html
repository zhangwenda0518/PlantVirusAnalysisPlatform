<!DOCTYPE html>
<html lang="{{ 'en' if lang == 'en' else 'zh-CN' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="vp-lang" content="{{ lang }}">
<title>{{ 'Task center - Plant Virus Analysis Platform' if lang == 'en' else '任务中心 - 植物病毒分析平台' }}</title>
<script>try{if(localStorage.getItem("vp_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
<style>
  .page { max-width: 1060px; margin: 0 auto; padding: 18px 20px 60px; }
  .tk-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .tk-head h1 { margin: 4px 0; font-size: 21px; }
  .tk-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 4px; }
  .tk-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tk-tabs .tab { border: 1px solid var(--line-200, #dfe6ec); background: var(--surface, #fff);
    border-radius: 99px; padding: 4px 14px; font-size: 12.5px; cursor: pointer; color: var(--ink-600, #456); }
  .tk-tabs .tab:hover { border-color: var(--green-600, #2e8b57); }
  .tk-tabs .tab.on { background: var(--green-700, #1c6b43); border-color: var(--green-700, #1c6b43);
    color: #fff; font-weight: 650; }
  .tk-tabs .tab .cnt { opacity: .75; font-size: 11px; margin-left: 3px; }
  .tk-stats { font-size: 11.5px; color: var(--ink-400, #789); margin: 4px 0 10px; font-family: var(--mono, monospace); }
  .task-card { border: 1px solid var(--line-200, #e5eaef); border-radius: 10px; padding: 10px 14px;
    margin: 8px 0; background: var(--surface, #fff); }
  .task-card.running { border-left: 3px solid var(--amber-500, #e8a13a); }
  .task-card.failed { border-left: 3px solid var(--red-500, #d9534f); }
  .task-card.done { border-left: 3px solid var(--green-500, #3a9d6b); }
  .task-card.cancelled { border-left: 3px solid var(--gray-300, #c4cdd4); }
  .tk-row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tk-row1 b { font-size: 13.5px; }
  .tk-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tk-meta { font-size: 11.5px; color: var(--ink-400, #789); margin: 3px 0 0; font-family: var(--mono, monospace); }
  .tk-msg { font-size: 12px; color: var(--ink-600, #456); margin: 3px 0 0; }
  .tk-err { font-size: 12px; color: var(--red-700, #b03a34); background: var(--red-100, #fdecea);
    border-radius: 6px; padding: 4px 8px; margin-top: 5px; }
  .tk-bar { height: 6px; border-radius: 3px; background: var(--gray-100, #edf1f4); margin-top: 7px;
    overflow: hidden; }
  .tk-bar i { display: block; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--green-600, #2e8b57), var(--green-400, #5bbd8a));
    transition: width .5s; }
  .tk-log-wrap { margin-top: 8px; }
  .tk-log-wrap summary { cursor: pointer; font-size: 12px; color: var(--ink-600, #456); user-select: none;
    list-style: none; }
  .tk-log-wrap summary::before { content: '▸ '; }
  .tk-log-wrap[open] summary::before { content: '▾ '; }
  .tk-log { font-family: Consolas, var(--mono, monospace); font-size: 11px; background: var(--gray-50, #f8f9fa);
    border: 1px solid var(--line-100, #eceff2); border-radius: 6px; padding: 7px 9px; margin-top: 6px;
    max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  html[data-theme="dark"] .tk-log { background: #1a222a; }
  .tk-empty { color: var(--ink-400, #789); font-size: 12.5px; padding: 18px 0; text-align: center; }
  h2.sec { font-size: 15px; margin: 22px 0 6px; padding-bottom: 5px; border-bottom: 1px solid var(--line-100, #eceff2); }
  .label-chk { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; color: var(--ink-600, #456); }
  /* ?focus=<tid>：从 AI 工作台/锚条跳转时定位并高亮该任务卡 */
  .task-card.focus-flash {
    outline: 2px solid var(--green-500);
    background: var(--green-50, #f2f8f4);
    transition: background 1.2s;
  }
  html[data-theme="dark"] .task-card.focus-flash { background: #1d3a2a; }
  /* 分组视图（2026-10-30）：按时间 / 按样品 / 按模块 */
  .tk-sep { width: 1px; height: 18px; background: var(--line-200, #dfe6ec); margin: 0 2px; }
  .tk-group { margin: 10px 0 4px; }
  .tk-group-head { display: flex; align-items: center; gap: 8px; cursor: pointer;
    user-select: none; padding: 5px 10px; border-radius: 8px;
    border: 1px solid var(--line-100, #eceff2); background: var(--gray-50, #f6f8f9); }
  .tk-group-head:hover { border-color: var(--green-600, #2e8b57); }
  .tk-group-head .carat { font-size: 10px; color: var(--ink-400, #789); width: 11px; }
  .tk-group.closed .carat::before { content: '▸'; }
  .tk-group:not(.closed) .carat::before { content: '▾'; }
  .tk-group-head .gname { font-size: 12.5px; font-weight: 650; color: var(--ink-600, #456); }
  .tk-group-head .gcnt { font-size: 11px; font-family: var(--mono, monospace); color: var(--ink-400, #789); }
  .tk-group-head .grun { font-size: 11px; color: var(--amber-600, #b97a1e); margin-left: auto; padding-right: 6px; }
  .tk-group-body { margin: 2px 0 8px 12px; }
  .tk-group-body .task-card { margin: 6px 0; }
  html[data-theme="dark"] .tk-group-head { background: #1a222a; }
</style>
</head>
<body>
{% include "_nav.html" %}
<div class="page">
  <div class="tk-head">
    <h1 data-i18n="tk.title">任务中心</h1>
    <span class="hint" data-i18n="tk.subtitle">全局任务监测：进度 / 日志 / 停止 / 重启 / 删除</span>
  </div>

  <div class="tk-toolbar">
    <div class="tk-tabs" id="tabs">
      <span class="tab on" data-f="all" data-i18n="tk.f.all">全部</span>
      <span class="tab" data-f="running" data-i18n="tk.f.running">运行中</span>
      <span class="tab" data-f="done" data-i18n="tk.f.done">已完成</span>
      <span class="tab" data-f="failed" data-i18n="tk.f.failed">失败</span>
      <span class="tab" data-f="cancelled" data-i18n="tk.f.cancelled">已停止</span>
    </div>
    <span class="tk-sep"></span>
    <div class="tk-tabs" id="gtabs" title="分组显示（选择会记住）" data-i18n-title="tk.gtip">
      <span class="tab on" data-g="time" data-i18n="tk.gtime">按时间</span>
      <span class="tab" data-g="sample" data-i18n="tk.gsample">按样品</span>
      <span class="tab" data-g="module" data-i18n="tk.gmodule">按模块</span>
    </div>
    <span style="flex:1"></span>
    <label class="label-chk" id="curOnlyWrap" style="display:none">
      <input type="checkbox" id="curOnlyChk">
      <span data-i18n="gx.onlyCur">只看当前样品</span><span id="curOnlySample"></span></label>
    <label class="label-chk"><input type="checkbox" id="autoChk" checked>
      <span data-i18n="tk.auto">自动刷新</span></label>
    <button class="btn small danger" onclick="stopAllTasks()" data-i18n="tk.stopAll">⛔ 停止全部任务</button>
    <button class="btn small" onclick="clearFinished()" data-i18n="tk.clear">🧹 清空已完成</button>
    <button class="btn small" onclick="refreshAll(true)" data-i18n="tk.refresh">↻ 刷新</button>
  </div>
  <div class="tk-stats" id="stats"></div>
  <div id="taskList"></div>

  <h2 class="sec"><span data-i18n="tk.arch">历史归档</span> <small class="hint" style="font-weight:400">{{ '(manual archive / pre-restart records)' if lang == 'en' else '（手动归档 / 重启前记录）' }}</small></h2>
  <div id="archList"></div>
</div>

<script src="/static/i18n.js?v={{ asset_v }}"></script>
<script src="/static/app.js?v={{ asset_v }}"></script>
  <script src="/static/app-compare.js?v={{ asset_v }}"></script>
  <script src="/static/app-runhistory.js?v={{ asset_v }}"></script>
  <script src="/static/app-jobs.js?v={{ asset_v }}"></script>
  <script src="/static/app-browse.js?v={{ asset_v }}"></script>
  <script src="/static/app-batch.js?v={{ asset_v }}"></script>
  <script src="/static/app-storage.js?v={{ asset_v }}"></script>
<script src="/static/examples.js?v={{ asset_v }}"></script>
<script>
/* 整个页面脚本包在 IIFE 里：顶层 let/const 不再与 app.js / i18n.js
   的全局声明处在同一词法环境，避免「Identifier already declared」
   导致整块脚本静默不执行；需要给内联 onclick 用的函数显式挂 window。 */
(function () {
'use strict';

/* ═════════ 任务中心：全局任务列表（active + archived） ═════════
   - active：TaskManager 内存任务（可停止/重启/删除/日志）
   - archived：tasks/*.json 归档（重启前历史，仅日志/删除）      */

let FILTER = 'all';
let CUR_ONLY = false;     // 只看全局当前样品（顶部导航的 VP_CTX.sample）
let TASKS = [];          // active 快照
let ARCH = [];           // archived 快照
let ARCH_TOTAL = 0;      // 磁盘归档总数（可能大于 ARCH.length，超 limit 截断）
let pollTimer = null;
let archLoaded = false;  // 归档只在首次/手动/删除后刷新（避免每轮 IO）
const LOG_TAIL = 300;    // 展开日志时拉取的行数

const jf = jfetch;   // 委托 app.js 全局 jfetch（行为口径一致）

/* ── 分组视图（2026-10-30）：按时间（平铺）/ 按样品 / 按模块 ──
   选择存 localStorage('vp_tasks_group')；组折叠状态只留页面内存。 */
let GROUP = (() => {
  const v = localStorage.getItem('vp_tasks_group');
  return (v === 'sample' || v === 'module') ? v : 'time';
})();
const GRP_CLOSED = new Set();   // '<mode>|<key>' → 折叠中的组

/* 任务名 → 样品名。写法与后端 samples._task_matches_sample 一致，外加
   AI 代跑的「AI执行·<样品>」（executors.py）；「AI执行·工具·」是工具任务，
   负向先行排除。匹配不到返回 ''（未关联样品）。 */
function sampleOfName(name) {
  const n = String(name || '');
  let m = n.match(/^(?:排队|Queued)·(.+)$/) || n.match(/^(?:队列|Queue)·(.+)$/);
  if (m) return m[1];
  m = n.match(/^(?:样品分析|Sample analysis)\s+(.+)$/);
  if (m) return m[1].trim();
  m = n.match(/^AI执行·(?!工具·)(.+)$/) || n.match(/^AI run·(.+)$/);
  if (m) return m[1].trim();
  m = n.match(/^(.+?) · /);   // 「<样品> · 阶段标签…」（samples.py 流水线任务）
  if (m) return m[1];
  return '';
}

/* 任务名 → 模块代码。规则顺序即优先级，中英任务名都要能归组；规则来自
   各 tm.start()/tm.attach() 调用点的命名（开发笔记补十七有完整清单）。 */
const MODULE_RULES = [
  ['sample', [/^(?:排队|Queued|队列|Queue)·/, /^(?:样品分析|Sample analysis)\s+/,
              /^AI执行·(?!工具·)/, /^AI run·/, / · /]],
  ['tools', [/^工具·/, /^Tool·/, /^AI执行·工具·/, /^AI tool·/, /^宿主预测·/,
             /^Host prediction·/, /^Contig分析·/, /^Contig /, /^导出迁移 GIF·/,
             /^GIF export·/]],
  ['db', [/宿主库构建/, /Host DB build/, /病毒库构建/, /Virus DB build/,
          /病毒鉴定库构建/, /Virus index build/, /通用病毒库构建/, /RVDB 库构建/,
          /RefSeq Viral/, /C-RVDB/]],
  ['refs', [/^下载·/, /^Download·/, /^ICTV下载/, /^ICTV download/, /^NCBI下载/,
            /^NCBI download/, /^GenBank下载/, /^GenBank download/, /^GenBank导入/,
            /^GenBank import/, /^CDS\/PEP 提取/, /^Extract CDS\/PEP/, /^GenBank巡检/,
            /^GenBank inspect/, /^集合建树/, /^Collection phylo/,
            /^下载\/准备 Taxonomy/, /^Download\/prepare Taxonomy/,
            /^病毒数据集下载/, /^Virus dataset download/,
            /datasets .*下载/, /datasets .*download/]],
  ['meta', [/^检索绘图·/, /^Meta plot·/, /^AI 元数据补全·/, /^AI metadata fill·/,
            /^AI 总结·/, /^AI summary·/, /^LOGAN 批量/, /^LOGAN batch/,
            /^公共检索/, /^Public search/]],
  ['export', [/^CDS\/PEP 导出·/, /^CDS\/PEP export·/, /^物种名校验·/,
              /^taxonomy check·/, /^提交 .sqn 生成·/, /^submit \.sqn·/]],
  ['sys', [/^存储占用扫描/, /^Storage/]],
];
const MODULE_ORDER = ['sample', 'tools', 'db', 'refs', 'meta', 'export', 'sys', 'other'];

function moduleOfName(name) {
  const n = String(name || '');
  for (const [code, rules] of MODULE_RULES)
    if (rules.some(re => re.test(n))) return code;
  return 'other';
}

function groupLabelOf(key) {
  if (GROUP === 'sample')
    return key === '__nosample__' ? t('tk.gnosample', '未关联样品') : key;
  const ent = {
    sample: ['tk.mod.sample', '样品分析'], tools: ['tk.mod.tools', '工具运行'],
    db: ['tk.mod.db', '数据库构建'], refs: ['tk.mod.refs', '下载与参考集'],
    meta: ['tk.mod.meta', '检索与鉴定'], export: ['tk.mod.export', '导出与提交'],
    sys: ['tk.mod.sys', '系统任务'], other: ['tk.mod.other', '其他任务'],
  }[key];
  return ent ? t(ent[0], ent[1]) : key;
}

function fmtClock(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function durOf(task) {
  const end = task.finished || (task.status === 'running' ? Date.now() / 1000 : null);
  return end ? fmtDur(end - task.started) : '';
}

const ST_TEXT = {
  running: [t('stt.running', '运行中'), 'tstat running'],
  done: [t('stt.done', '已完成'), 'tstat done'],
  failed: [t('stt.failed', '失败'), 'tstat failed'],
  cancelled: [t('stt.stopped', '已停止'), 'tstat cancelled'],
};
function stBadge(task) {
  const [txt, cls] = ST_TEXT[task.status] || [task.status, 'tstat'];
  return `<span class="${cls}">${txt}</span>`;
}

function resultLink(task) {
  // 优先任务发起方登记的跳转地址，其次样品报告（href 转义防属性注入）
  if (task.link) return { href: esc(task.link), text: t('tk.goto', '前往页面') };
  if (task.result && task.result.report) return { href: esc(task.result.report), text: t('tk.openReport', '打开报告') };
  return null;
}

const LOG_OPEN = new Set();   // 展开状态的日志卡（重绘后保持）
const cardSigs = {};          // tid -> 状态签名（增量渲染，防日志卡闪烁）

function sigOf(task) {
  return [task.status, task.pct, task.msg, task.stage, task.error, task.eta,
          task.link || '', task.restart ? 1 : 0].join('|');
}

function actionsHtml(task, archived) {
  const btns = [];
  if (!archived && task.status === 'running')
    btns.push(`<button class="btn small danger" onclick="stopTask('${task.id}')">⏹ ${t('tk.stop', '停止')}</button>`);
  if (!archived && task.status !== 'running' && task.restart)
    btns.push(`<button class="btn small" onclick="restartTask('${task.id}')" title="${t('tk.restartTip', '重新提交同一请求')}">↻ ${t('tk.restart', '重启')}</button>`);
  const rl = resultLink(task);
  if (rl && task.status === 'done')
    btns.push(`<a class="btn small" href="${rl.href}" style="text-decoration:none">${rl.text}</a>`);
  // 手动归档（2026-11-02）：切模块 / 切功能 / 刷新都不归档，只有这里点了才进历史；
  // 归档后还能「↩ 恢复」回运行列表（记录与日志都在 tasks/_archive/ 下）。
  if (!archived && !task.external && task.status !== 'running' && task.status !== 'queued')
    btns.push(`<button class="btn small" onclick="archiveTask('${task.id}', this.dataset.n)"`
      + ` data-n="${esc(task.name || '')}" title="${t('tk.archiveTip', '移入历史归档（可随时恢复）')}">${t('tk.archive', '📦 归档')}</button>`);
  if (archived)
    btns.push(`<button class="btn small" onclick="restoreTask('${task.id}')">${t('tk.restore', '↩ 恢复')}</button>`);
  btns.push(`<button class="btn small" onclick="delTask('${task.id}', ${archived})">🗑 ${t('tk.del', '删除')}</button>`);
  return `<span class="tk-actions">${btns.join('')}</span>`;
}

function cardHtml(task, archived) {
  const pct = (task.pct != null && task.pct > 0) ? Math.min(100, Math.round(task.pct * 100)) : null;
  const dur = durOf(task);
  const meta = [`${t('tk.started', '开始')} ${fmtClock(task.started)}`];
  if (dur) meta.push(`${t('tk.dur', '耗时')} ${dur}`);
  if (task.eta != null && task.status === 'running') meta.push(`${t('tk.eta', '预计剩余')} ${fmtDur(task.eta)}`);
  const logId = `log-${task.id}`;
  // 输出目录：分析任务创建时由后端登记（out_dir），随卡片明示结果写在哪
  const outdirRow = task.out_dir
    ? `<p class="tk-meta" style="margin-top:4px">📁 ${t('tk.outdir', '输出目录')} <span style="user-select:all">${esc(task.out_dir)}</span>
       <button class="btn small" style="padding:1px 8px;margin-left:6px" data-d="${esc(task.out_dir)}" onclick="openOutDir(this.dataset.d)" title="${t('c.openDir', '在资源管理器中打开')}">📂 ${t('c.openDir', '打开')}</button></p>`
    : '';
  const details = `
    <details class="tk-log-wrap" ${LOG_OPEN.has(task.id) ? 'open' : ''} ontoggle="onLogToggle(this,'${task.id}',${archived})">
      <summary>${t('tk.log', '日志')}</summary>
      <div class="tk-log" id="${logId}">${t('tk.logLoading', '加载中…')}</div>
    </details>`;
  return `<div class="task-card ${task.status}" data-tid="${task.id}">
    <div class="tk-row1">
      ${stBadge(task)}
      <b>${esc(trTaskName(task.name))}</b>
      ${actionsHtml(task, archived)}
    </div>
    ${task.msg ? `<p class="tk-msg">${esc(trTaskMsg(task.msg))}</p>` : ''}
    ${pct != null ? `<div class="tk-bar"><i style="width:${pct}%"></i></div>` : ''}
    <p class="tk-meta">${meta.join(' · ')}${task.stage ? ' · ' + esc(trTaskMsg(task.stage)) : ''}</p>
    ${outdirRow}
    ${task.error ? `<div class="tk-err">${esc(trTaskMsg(task.error))}</div>` : ''}
    ${details}
  </div>`;
}

/* 单张卡片的增量放置（cardSigs 签名防闪烁）；body 为卡片应处的容器
   （平铺 = 列表根，分组 = 组体）。签名没变就只挪位置，不变 DOM。 */
function placeCard(box, body, tk, archived, keep) {
  const sig = sigOf(tk);
  const tid = tk.id;
  const sk = (archived ? 'a:' : '') + tid;
  let el = box.querySelector(`.task-card[data-tid="${CSS.escape(tid)}"]`);
  if (!el || cardSigs[sk] !== sig) {
    const tmp = document.createElement('div');
    tmp.innerHTML = cardHtml(tk, archived);
    const fresh = tmp.firstElementChild;
    if (el) {
      // 重建前转移展开日志内容，消除闪烁
      const oldLog = el.querySelector('.tk-log');
      if (oldLog) {
        const newLog = fresh.querySelector('.tk-log');
        if (newLog && oldLog.textContent && oldLog.textContent !== t('tk.logLoading', '加载中…'))
          newLog.textContent = oldLog.textContent;
      }
      el.replaceWith(fresh);
    } else {
      body.appendChild(fresh);
    }
    el = fresh;
    cardSigs[sk] = sig;
  }
  body.appendChild(el);   // appendChild 移动已有节点 = 保序
  keep.add(tid);
}

/* 平铺 / 分组共用的列表布局：GROUP 决定卡片进哪个容器。
   卡片的样品/模块归属不随时间变化，增量逻辑在两种模式下都成立。 */
function layoutList(box, tasks, archived) {
  const keep = new Set();
  if (GROUP === 'time') {
    box.querySelectorAll('.tk-group').forEach(sec => sec.remove());
    tasks.forEach(tk => placeCard(box, box, tk, archived, keep));
  } else {
    const groups = new Map();
    tasks.forEach(tk => {
      const key = GROUP === 'sample'
        ? (sampleOfName(tk.name) || '__nosample__')
        : moduleOfName(tk.name);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(tk);
    });
    const keys = [...groups.keys()];
    if (GROUP === 'module') {
      keys.sort((a, b) => MODULE_ORDER.indexOf(a) - MODULE_ORDER.indexOf(b));
    } else {
      const newest = a => Math.max(...a.map(x => x.started || 0));
      keys.sort((a, b) => a === '__nosample__' ? 1
        : b === '__nosample__' ? -1 : newest(groups.get(b)) - newest(groups.get(a)));
    }
    keys.forEach(key => {
      const ck = GROUP + '|' + key;
      let sec = box.querySelector(`.tk-group[data-gkey="${CSS.escape(key)}"]`);
      if (!sec) {
        sec = document.createElement('section');
        sec.className = 'tk-group';
        sec.dataset.gkey = key;
        sec.innerHTML = `<div class="tk-group-head" onclick="toggleGroup(this)">
            <span class="carat"></span><span class="gname"></span>
            <span class="gcnt"></span><span class="grun"></span>
          </div><div class="tk-group-body"></div>`;
        box.appendChild(sec);
      }
      sec.classList.toggle('closed', GRP_CLOSED.has(ck));
      const arr = groups.get(key);
      sec.querySelector('.gname').textContent = groupLabelOf(key);
      sec.querySelector('.gcnt').textContent = ' ' + arr.length;
      const run = arr.filter(x => x.status === 'running').length;
      sec.querySelector('.grun').textContent = run
        ? '● ' + run + ' ' + t('tk.f.running', '运行中') : '';
      const body = sec.querySelector('.tk-group-body');
      arr.forEach(tk => placeCard(box, body, tk, archived, keep));
    });
    box.querySelectorAll('.tk-group').forEach(sec => {
      if (!keys.includes(sec.dataset.gkey)) sec.remove();
    });
  }
  // 清理消失的卡（含换组/换模式后遗留在别处的）
  box.querySelectorAll('.task-card').forEach(el => {
    if (!keep.has(el.dataset.tid)) {
      delete cardSigs[(archived ? 'a:' : '') + el.dataset.tid];
      el.remove();
    }
  });
  // 重建后 open 卡手动加载日志（DOM 重建不触发 ontoggle）
  box.querySelectorAll('.tk-log-wrap[open]').forEach(d => {
    const id = d.querySelector('.tk-log').id.slice(4);
    loadLog(d, id, archived);
  });
}

function render() {
  const list = document.getElementById('taskList');
  const byStatus = TASKS.filter(t => FILTER === 'all' ? true : t.status === FILTER);
  const shown = byStatus.filter(t => !CUR_ONLY || sampleMatches(t.name));
  if (!shown.length) {
    // 「只看当前样品」把项目级/无样品归属的任务（下载批次、存储扫描、
    // .sqn/校验/导出等）滤掉了 —— 必须说清楚是"被过滤"而不是"什么都没有"，
    // 否则用户会以为刚点的下载凭空消失。
    const hidden = byStatus.length - shown.length;
    list.innerHTML = `<div class="tk-empty">${CUR_ONLY && hidden > 0
      ? t('tk.emptyFiltered', '已按当前样品过滤，另有 {n} 个任务被隐藏；'
          + '取消勾选「只看当前样品」即可看到').replace('{n}', hidden)
      : t('tk.empty', '当前过滤条件下暂无任务')}</div>`;
  } else {
    layoutList(list, shown, false);
  }
  const cnt = k => TASKS.filter(x => x.status === k).length;
  document.getElementById('stats').textContent =
    `${t('tk.f.running', '运行中')} ${cnt('running')} · `
    + `${t('tk.f.done', '已完成')} ${cnt('done')} · `
    + `${t('tk.f.failed', '失败')} ${cnt('failed')} · `
    + `${t('tk.f.cancelled', '已停止')} ${cnt('cancelled')}`
    + (archLoaded ? ` · ${t('tk.archCnt', '归档')} ${ARCH.length}`
        + (ARCH_TOTAL > ARCH.length ? `/${ARCH_TOTAL}` : '') : '');
  document.querySelectorAll('#tabs .tab').forEach(el => {
    const f = el.dataset.f;
    const n = f === 'all' ? TASKS.length : cnt(f);
    el.querySelector('.cnt')?.remove();
    if (n) { const s = document.createElement('span'); s.className = 'cnt'; s.textContent = n; el.appendChild(s); }
  });
}

function renderArch() {
  const box = document.getElementById('archList');
  if (!ARCH.length) {
    box.innerHTML = `<div class="tk-empty">${t('tk.noArch', '暂无归档任务')}</div>`;
    return;
  }
  layoutList(box, ARCH, true);
}

/* ── 日志：展开时加载；running 任务展开期间 2s 轮询 ── */
const logTimers = {};
async function loadLog(details, tid, isArchived) {
  const box = document.getElementById('log-' + tid);
  if (!box || !details.open) { clearTimeout(logTimers[tid]); return; }
  try {
    const d = isArchived
      ? await jf(`/api/task/${tid}/log?lines=${LOG_TAIL}`)
      : await jf(`/api/task/${tid}?log_lines=${LOG_TAIL}`);
    const lines = d.log || [];
    const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 24;
    box.textContent = lines.length ? lines.join('\n') : t('c.noLogPar','（暂无日志）');
    if (stick) box.scrollTop = box.scrollHeight;
  } catch (e) {
    box.textContent = '日志加载失败：' + e.message;
  }
  clearTimeout(logTimers[tid]);
  if (!isArchived) {
    const t = TASKS.find(x => x.id === tid);
    if (t && t.status === 'running')
      logTimers[tid] = setTimeout(() => loadLog(details, tid, false), 2000);
  }
}
function onLogToggle(details, tid, archived) {
  if (details.open) { LOG_OPEN.add(tid); loadLog(details, tid, archived); }
  else { LOG_OPEN.delete(tid); clearTimeout(logTimers[tid]); }
}

/* ── 数据拉取与轮询 ── */
async function fetchActive() {
  TASKS = await jf('/api/tasks?logs=0');
  render();
}
async function fetchArch() {
  const d = await jf('/api/tasks?full=1&logs=0');
  ARCH = d.archived || [];
  ARCH_TOTAL = d.archived_total != null ? d.archived_total : ARCH.length;
  archLoaded = true;
  renderArch(); render();
}
async function refreshAll(manual) {
  try { await fetchActive(); } catch (e) { /* 静默 */ }
  if (manual || !archLoaded) { try { await fetchArch(); } catch (e) {} }
  schedule();
}
function schedule() {
  clearTimeout(pollTimer);
  if (document.hidden || !document.getElementById('autoChk').checked) return;
  const running = TASKS.some(t => t.status === 'running');
  pollTimer = setTimeout(refreshAll, running ? 2500 : 10000);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && document.getElementById('autoChk').checked) refreshAll();
});

/* ── 操作 ── */
async function stopTask(tid) {
  if (!confirm(t('tk.confirmStop', '停止该任务？（已启动的子进程会被终止）'))) return;
  try { await jf(`/api/task/${tid}/cancel`, { method: 'POST' }); } catch (e) { alert(e.message); }
  refreshAll();
}
async function restartTask(tid) {
  const tk = TASKS.find(x => x.id === tid);
  if (!tk || !tk.restart) return;
  if (!confirm(t('tk.confirmRestart', '重新提交此任务？将以相同参数再次发起。'))) return;
  try {
    const d = await jf(tk.restart.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(tk.restart.body || {}),
    });
    toast(t('tk.restarted', '已重新提交'), d.task || '', { ttl: 4000 });
    refreshAll();
  } catch (e) { alert(t('tk.restartFail', '重启失败') + '：' + e.message); }
}
/* 手动归档 / 恢复（2026-11-02 用户定案）：切换模块、切功能、整页刷新都不会
   归档任何任务；只有这张卡上的「📦 归档」把记录移进 run/tasks/_archive/，
   「↩ 恢复」再把它放回运行列表（不重启任务，只恢复记录）。 */
async function archiveTask(tid, name) {
  const ask = t('tk.confirmArchive', '归档任务「{name}」？\n记录移入历史归档（可随时恢复），日志与结果文件保留。');
  if (!confirm(ask.replace('{name}', name || ''))) return;
  try {
    await jf(`/api/task/${tid}/archive`, { method: 'POST' });
    toast(t('tk.archivedOne', '已归档'), name || '', { ttl: 3000 });
  } catch (e) { alert(t('tk.archiveFail', '归档失败') + '：' + e.message); }
  archLoaded = false;
  await refreshAll(true);
  if (window.runBarTick) window.runBarTick();
}
async function restoreTask(tid) {
  try {
    await jf(`/api/task/${tid}/unarchive`, { method: 'POST' });
    toast(t('tk.restored', '已恢复到运行列表'), '', { ttl: 3000 });
  } catch (e) { alert(t('tk.restoreFail', '恢复失败') + '：' + e.message); }
  archLoaded = false;
  await refreshAll(true);
  if (window.runBarTick) window.runBarTick();
}
async function delTask(tid, archived) {
  if (!confirm(archived
    ? t('tk.confirmDelArch', '删除该归档记录？')
    : t('tk.confirmDel', '删除该任务记录？（日志文件保留在 logs/tasks/）'))) return;
  try { await jf(`/api/task/${tid}/delete`, { method: 'POST' }); } catch (e) { alert(e.message); }
  if (archived) { archLoaded = false; await refreshAll(true); }
  else {
    await fetchActive();
    ARCH = ARCH.filter(x => x.id !== tid); renderArch();
  }
  if (window.runBarTick) window.runBarTick();
}
async function clearFinished() {
  if (!confirm(t('tk.confirmClear', '清空所有已完成 / 失败 / 已停止的任务记录？（运行中不受影响）'))) return;
  try {
    const d = await jf('/api/tasks/clear_finished', { method: 'POST' });
    toast(t('tk.cleaned', '已清理'), t('tk.removedN', '移除 {n} 条任务记录').replace('{n}', d.removed), { ttl: 4000 });
  } catch (e) { alert(e.message); }
  archLoaded = false;
  await refreshAll(true);
  if (window.runBarTick) window.runBarTick();
}
async function stopAllTasks() {
  if (!confirm(t('tk.confirmStopAll', '停止全部运行中 / 排队中的任务？（任务记录与结果文件保留）'))) return;
  try {
    const d = await jf('/api/tasks/stop_all', { method: 'POST' });
    if (d.active_left > 0) {
      toast(t('tk.stoppingAll', '正在停止'),
            t('tk.stopAllLeft', '已受理 {n} 个停止请求，还有 {m} 个任务在收尾')
              .replace('{n}', d.cancelled).replace('{m}', d.active_left), { ttl: 5000 });
    } else {
      toast(t('tk.stoppedAll', '已全部停止'),
            t('tk.cancelledN', '共停止 {n} 个任务').replace('{n}', d.cancelled), { ttl: 4000 });
    }
  } catch (e) { alert(e.message); }
  refreshAll();
}

/* ── 只看当前样品 ──
   任务名里带样品名的三种写法与后端 samples._task_matches_sample 保持一致
   （多了第四条第 4 项的「排队·」镜像卡，见下），用锚定正则而不是
   indexOf，避免样品 NX-1 误配到 NX-10 的任务。 */
function sampleMatches(name) {
  const s = (window.VP_CTX && window.VP_CTX.sample) || '';
  if (!s) return true;
  const n = String(name || '');
  const q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return n.indexOf(s + ' · ') === 0
    || new RegExp('^(?:队列|Queue)·' + q + '$').test(n)
    || new RegExp('^(?:样品分析|Sample analysis)\\s+' + q + '(?:\\b|$)').test(n)
    // 第 4 条：排队中的样品在任务中心挂的是**镜像卡**「排队·<样品>」
    // （真任务「队列·<样品>」要等开跑才出现）。它同样属于这个样品，
    // 若不认它，用户一勾「只看当前样品」刚入队的样品就凭空消失。
    // 后端 _task_matches_sample 故意不加这条：镜像卡不占任何资源，
    // 不该让「样品忙」判定为真而挡住删除。
    || new RegExp('^(?:排队|Queued)·' + q + '$').test(n);
}

function syncCurOnly() {
  const wrap = document.getElementById('curOnlyWrap');
  const chk = document.getElementById('curOnlyChk');
  const lbl = document.getElementById('curOnlySample');
  if (!wrap || !chk) return;
  const s = (window.VP_CTX && window.VP_CTX.sample) || '';
  wrap.style.display = s ? '' : 'none';
  wrap.title = t('gx.onlyCurTip', '');
  if (!s) {
    CUR_ONLY = false;
    chk.checked = false;
    if (lbl) lbl.textContent = '';
    return;
  }
  // 样品名写进独立 span：静态文案那格带 data-i18n，会被 applyI18n 重写
  if (lbl) lbl.textContent = '（' + s + '）';
}

/* 顶部导航切换全局样品时，本页筛选标签与列表同步 */
document.addEventListener('vp-ctx', () => { syncCurOnly(); render(); });

/* ── 初始化 ── */
document.querySelectorAll('#tabs .tab').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('#tabs .tab').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    FILTER = el.dataset.f;
    render();
  };
});
/* 分组切换（按时间 / 按样品 / 按模块）：记住选择，两个列表都重排 */
document.querySelectorAll('#gtabs .tab').forEach(el => {
  el.classList.toggle('on', el.dataset.g === GROUP);
  el.onclick = () => {
    GROUP = el.dataset.g;
    try { localStorage.setItem('vp_tasks_group', GROUP); } catch (e) { /* 隐私模式 */ }
    document.querySelectorAll('#gtabs .tab').forEach(x => x.classList.toggle('on', x === el));
    render();
    if (archLoaded) renderArch();
  };
});
document.getElementById('curOnlyChk').onchange = (e) => {
  CUR_ONLY = e.target.checked;
  render();
};
syncCurOnly();
document.getElementById('autoChk').onchange = () => {
  clearTimeout(pollTimer);
  if (document.getElementById('autoChk').checked) schedule();
};
refreshAll(true);

/* 内联 onclick 需要这些函数在全局作用域可见（列表用 HTML 字符串渲染） */
window.stopTask = stopTask;
window.restartTask = restartTask;
window.delTask = delTask;
window.archiveTask = archiveTask;
window.restoreTask = restoreTask;
window.clearFinished = clearFinished;
window.stopAllTasks = stopAllTasks;
window.refreshAll = refreshAll;
window.onLogToggle = onLogToggle;
window.toggleGroup = function (head) {
  const sec = head.parentElement;
  sec.classList.toggle('closed');
  const k = GROUP + '|' + sec.dataset.gkey;
  if (sec.classList.contains('closed')) GRP_CLOSED.add(k);
  else GRP_CLOSED.delete(k);
};

/* ?focus=<tid>（2026-10-30）：AI 工作台 / 锚条跳转时定位到该任务卡。
   列表是异步渲染的，轮询等它出现；10 秒还没出就放弃。 */
(function () {
  const tid = new URLSearchParams(location.search).get('focus');
  if (!tid) return;
  let tries = 0;
  const timer = setInterval(() => {
    const el = document.querySelector(
      '.task-card[data-tid="' + CSS.escape(tid) + '"]');
    if (el) {
      clearInterval(timer);
      el.scrollIntoView({ block: 'center' });
      el.classList.add('focus-flash');
      setTimeout(() => el.classList.remove('focus-flash'), 3000);
    } else if (++tries > 40) {
      clearInterval(timer);
    }
  }, 250);
})();

})();
</script>
